name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'curated/**'
      - 'community/**'
      - 'scripts/deploy-curated-skill.sh'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'curated/**'
      - 'community/**'
      - 'scripts/deploy-curated-skill.sh'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验所有技能格式
        run: bash scripts/validate-skill.sh
      - name: 校验精选技能单向部署
        run: |
          skills_root="$(mktemp -d)"
          scripts/deploy-curated-skill.sh install bit-secret-manager "$skills_root"
          scripts/deploy-curated-skill.sh check bit-secret-manager "$skills_root"
          printf '\n# drift\n' >> "$skills_root/bit-secret-manager/SKILL.md"
          ! scripts/deploy-curated-skill.sh check bit-secret-manager "$skills_root"
