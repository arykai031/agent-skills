name: Publish Registry

on:
  push:
    branches:
      - main
    paths:
      - 'curated/**'
      - 'community/**'

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 registry.json
        run: bash scripts/build-registry.sh
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "chore: auto-update registry [skip ci]"
          git push
