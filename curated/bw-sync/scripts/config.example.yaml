# bw-sync 通用配置模板
# 复制此文件并按需修改
#
# 完整配置项说明：Yon-w/docs/outputs/bw-sync-universal/README.md

bitwarden:
  # Project ID（二选一：project_id 或 organization_id）
  project_id: ""
  # organization_id: ""

  # bws CLI 路径（默认自动查找 PATH）
  bws_path: "bws"

  # Token 来源
  token:
    source: "file"           # file / env / arg
    env_var: "BWS_ACCESS_TOKEN"
    file_path: "~/.bw/env"

output:
  # 模式: env_set / env_file / stdout / shell
  mode: "env_file"

  # env_set 模式：目标命令模板
  target_command: "qwenpaw env set"

  # env_file 模式
  # 建议优先用收口目录路径（如 <a_work>/configs/secrets.env），不要放易失路径
  # （容器 /root、/etc 等重建即还原）；写入后自动 chmod 600
  env_file_path: "<a_work>/configs/secrets.env"
  env_file_append: false      # false=覆盖, true=追加

  # 过滤（可选）
  only_keys: []               # 仅同步这些 key
  exclude_keys: []            # 排除这些 key

secrets:
  # 透传模式：Bitwarden key 直接作为环境变量名
  pass_through: false

  # 手动映射（pass_through=false 时生效）
  MAP:
    # 环境变量名: Bitwarden Secret Key
    EXAMPLE_KEY: EXAMPLE_KEY
